    <script type="text/javascript">
      // 读取 URL 中的 lang 参数
      var gameLang = (function () {
        var params = new URLSearchParams(window.location.search)
        var lang = params.get('lang')
        return lang || 'en'
      })()

      // 将语言保存到全局变量，供其他脚本使用
      window.GAME_LANG = gameLang

      function getResourceName(baseName) {
        if (GAME_LANG.startsWith('en')) {
          var enName = baseName + '_en'
          if (dataList[enName] !== undefined) {
            return enName
          }
        } else if (GAME_LANG.startsWith('zh')) {
          var zhName = baseName + '_zh'
          if (dataList[zhName] !== undefined) {
            return zhName
          }
        }
        return baseName
      }
    </script>
